[tox]
env_list =
    py312
    py313
    py314
    py315
skip_missing_interpreters = false

[testenv]
description = test the shared CPython 3.12 ABI3 wheel on {base_python}
package = wheel
wheel_build_env = .pkg
change_dir = {env_tmp_dir}
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    setuptools>=77
    wheel
commands =
    python -I -c "import sys, pyv8; print(sys.version); print(pyv8.__file__)"
    python -I -m pytest --import-mode=importlib -q {tox_root}/tests

[testenv:.pkg]
description = build the shared CPython 3.12 ABI3 wheel
base_python = python312
pass_env =
    PYV8_*
    DEPOT_TOOLS_*
    HTTP_PROXY
    HTTPS_PROXY
    NO_PROXY

[testenv:py312]
base_python = python312

[testenv:py313]
base_python = python313

[testenv:py314]
base_python = python314

[testenv:py315]
base_python = python315

[testenv:lint]
package = skip
deps =
    black>=23.0.0
    isort>=5.12.0
    flake8>=6.0.0
commands =
    black --check pyv8 tests
    isort --check-only pyv8 tests
    flake8 pyv8 tests

[flake8]
max-line-length = 100
exclude = .tox,*.egg,build,data
select = E,W,F
ignore = E203, W503
