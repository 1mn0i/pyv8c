name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyv8-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The repository ships the platform-specific extension. Exercise that
  # artifact on every supported CPython runtime before attempting a rebuild.
  prebuilt:
    name: prebuilt / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=7" "websockets>=16"
      - name: Verify shipped native files
        shell: pwsh
        run: |
          if (-not (Test-Path "pyv8\_pyv8.pyd")) {
            throw "The shipped Windows extension pyv8\_pyv8.pyd is missing"
          }
          if (-not (Test-Path "pyv8\icudtl.dat")) {
            throw "The matching V8 ICU data file pyv8\icudtl.dat is missing"
          }
          python -c "import pyv8; print(pyv8.__file__)"
      - name: Run test suite
        run: python -m pytest -q

  python-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q pyv8 tests

  native-build:
    name: native build / Windows Python 3.10
    runs-on: windows-latest
    needs: [python-check]
    timeout-minutes: 120
    env:
      # V8's Windows build must use the checked-in Python 3.10 ABI3 floor.
      PYV8_BUILD_V8: "1"
      PYV8_V8_JOBS: "4"
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Configure V8 build environment
        shell: pwsh
        run: |
          $version = (Get-Content V8_VERSION -Raw).Trim()
          "PYV8_V8_VERSION=$version" >> $env:GITHUB_ENV
          "PYV8_BUILD_ROOT=$env:GITHUB_WORKSPACE\.pyv8-build" >> $env:GITHUB_ENV
      - name: Cache V8 build
        uses: actions/cache@v4
        with:
          path: .pyv8-build
          key: ${{ runner.os }}-v8-${{ hashFiles('V8_VERSION', 'setup.py', 'v8_build.py', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-v8-
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "pytest>=7" "websockets>=16"
      - name: Build extension against V8
        run: python setup.py build_ext --inplace --force
      - name: Run native regression suite
        run: python -m pytest -q
