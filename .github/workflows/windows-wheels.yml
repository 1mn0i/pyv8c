name: Windows wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      PYV8_V8_JOBS: '2'
      PYV8_TARGET_CPU: x64
      PYV8_GN_ARGS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine "setuptools>=77" wheel
      - name: Select a complete Windows SDK
        id: sdk
        shell: pwsh
        run: |
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10'
          $versions = Get-ChildItem "$sdkRoot/Include" -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' -and [version]$_.Name -ge [version]'10.0.26100.0' } |
            Sort-Object { [version]$_.Name } -Descending
          $sdk = $versions | Where-Object {
            $v = $_.Name
            (Test-Path "$sdkRoot/Include/$v/um") -and
            (Test-Path "$sdkRoot/Include/$v/shared") -and
            (Test-Path "$sdkRoot/Include/$v/ucrt") -and
            (Test-Path "$sdkRoot/Lib/$v/um/x64") -and
            (Test-Path "$sdkRoot/Lib/$v/ucrt/x64")
          } | Select-Object -First 1
          if (-not $sdk) { throw 'No complete Windows SDK found' }
          "PYV8_WINDOWS_SDK=$sdkRoot" >> $env:GITHUB_ENV
          "PYV8_WINDOWS_SDK_VERSION=$($sdk.Name)" >> $env:GITHUB_ENV
          $imageVersion = if ($env:ImageVersion) { $env:ImageVersion } else { 'unknown' }
          if ($imageVersion -eq 'unknown') { throw 'Runner image version is required for the V8 cache key' }
          $v8Version = (Get-Content pyv8/V8_VERSION -Raw).Trim()
          "PYV8_V8_VERSION=$v8Version" >> $env:GITHUB_ENV
          "v8-version=$v8Version" >> $env:GITHUB_OUTPUT
          $gnOverride = if ($null -ne $env:PYV8_GN_ARGS) { $env:PYV8_GN_ARGS } else { '' }
          $gnArgs = [Text.Encoding]::UTF8.GetBytes($gnOverride)
          $gnHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($gnArgs)).ToLowerInvariant()
          $cacheKey = "v8-v3-${{ runner.os }}-${{ env.PYV8_TARGET_CPU }}-$imageVersion-$($sdk.Name)-$gnHash-${{ hashFiles('pyv8/V8_VERSION', 'pyv8/v8_build.py') }}"
          "cache-key=$cacheKey" >> $env:GITHUB_OUTPUT
          Write-Host "Selected Windows SDK $($sdk.Name) on image $imageVersion"
      # Restore only an exact match. The image and SDK are part of the key because
      # V8's stamp records GN args and target, but not the Windows toolchain.
      - name: Restore V8 build cache
        id: v8-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/include
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/out/pyv8-*.release
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/third_party/llvm-build/Release+Asserts/bin
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/third_party/llvm-build/Release+Asserts/lib
          key: ${{ steps.sdk.outputs.cache-key }}
      - name: Validate restored V8 outputs
        shell: pwsh
        run: |
          $versionsRoot = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'pyv8/.pyv8-build/versions'))
          $v8Home = [IO.Path]::GetFullPath((Join-Path $versionsRoot '${{ steps.sdk.outputs.v8-version }}/v8'))
          if (-not $v8Home.StartsWith($versionsRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase) -or [IO.Path]::GetFileName($v8Home) -ne 'v8') {
            throw "Unexpected V8 cache path: $v8Home"
          }
          if (Test-Path -LiteralPath $v8Home) {
            $item = Get-Item -LiteralPath $v8Home -Force
            if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw "V8 cache directory is a reparse point: $v8Home" }
            if (-not (Test-Path -LiteralPath (Join-Path $v8Home '.git'))) {
              python pyv8/tools/validate_v8_cache.py
              if ($LASTEXITCODE -ne 0) {
                Write-Warning 'Discarding incomplete V8 cache; delete the matching GitHub cache entry if this repeats.'
                Remove-Item -LiteralPath $v8Home -Recurse -Force
                $global:LASTEXITCODE = 0
              }
            }
          }
      - name: Build V8
        id: v8-build
        working-directory: pyv8
        run: python -c "from v8_build import V8BuildConfig; V8BuildConfig.from_environment('.', download_and_build=True).prepare()"
      - name: Build the Windows wheel
        run: |
          python -m build --wheel --outdir dist .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m twine check dist/*
      - name: Save V8 build cache
        if: ${{ steps.v8-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/include
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/out/pyv8-*.release
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/third_party/llvm-build/Release+Asserts/bin
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/third_party/llvm-build/Release+Asserts/lib
          key: ${{ steps.sdk.outputs.cache-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-wheels
          path: dist/*.whl
          if-no-files-found: error

  test:
    needs: build
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          allow-prereleases: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-wheels
          path: dist
      - name: Install wheels
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = Get-ChildItem dist/*.whl | ForEach-Object { $_.FullName }
          python -m pip install $wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Verify installed wheels outside checkout
        working-directory: ${{ runner.temp }}
        run: python -I "${{ github.workspace }}/tools/smoke_wheels.py"
