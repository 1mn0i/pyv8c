[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v8n"
version = "0.1.0"
description = "Native V8 bindings for pyv8c"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12, <4"
keywords = ["v8", "javascript", "pyv8c"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Software Development :: Libraries",
]

# The Python facade lives next to the native project, at _pyv8/v8n, so that a
# checkout exposes one importable package no matter which side is being worked
# on.  package-dir is what tells setuptools where to read it from and where to
# put the compiled extension.
[tool.setuptools]
packages = ["v8n"]
package-dir = { v8n = "../v8n" }

[tool.setuptools.package-data]
v8n = ["_v8n.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
