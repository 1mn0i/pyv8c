[tox]
env_list =
    py312
    py313
    py314
    py315
skip_missing_interpreters = false

[testenv]
description = test the shared CPython 3.12 ABI3 wheel on {base_python}
package = wheel
wheel_build_env = .pkg
change_dir = {env_tmp_dir}
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-timeout>=2.2
    pytest-repeat>=0.9
    pytest-xdist>=3.6
    Pillow>=10
    cryptography>=42
    setuptools>=77
    wheel
commands =
    python -I -c "import sys; from pyv8c import pyv8; print(sys.version); print(pyv8.__file__)"
    python -I -c "import sys; import pyv8c; import pytest; sys.path[:0] = [r'{tox_root}/pyv8c/tests', r'{tox_root}/pyv8c/tests/integration']; raise SystemExit(pytest.main())" --import-mode=importlib -c {tox_root}/pytest.ini -q {tox_root}/pyv8/tests {tox_root}/pyv8c/tests/unit {tox_root}/pyv8c/tests/browser {tox_root}/pyv8c/tests/integration

[testenv:.pkg]
description = build the shared CPython 3.12 ABI3 wheel
base_python = python312
pass_env =
    PYV8_*
    DEPOT_TOOLS_*
    HTTP_PROXY
    HTTPS_PROXY
    NO_PROXY

[testenv:py312]
base_python = python312

[testenv:py313]
base_python = python313

[testenv:py314]
base_python = python314

[testenv:py315]
base_python = python315

[testenv:lint]
package = skip
deps =
    black>=23.0.0
    isort>=5.12.0
    flake8>=6.0.0
commands =
    black --check pyv8/build_support.py pyv8/v8_build.py pyv8/tests pyv8c/pyv8c pyv8c/tests
    isort --check-only pyv8/build_support.py pyv8/v8_build.py pyv8/tests pyv8c/pyv8c pyv8c/tests
    flake8 pyv8/build_support.py pyv8/v8_build.py pyv8/tests pyv8c/pyv8c pyv8c/tests

[flake8]
max-line-length = 100
exclude = .tox,*.egg,build,data
select = E,W,F
ignore = E203, W503
