[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyv8c"
version = "0.1.0"
description = "A deterministic Chromium-like BOM/DOM environment on pyv8"
requires-python = ">=3.10"
dependencies = ["loguru>=0.7"]

[project.optional-dependencies]
network = ["cycronet>=144.4.7,<151"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyv8c*"]
exclude = ["build*", "dist*", "tests*"]

[tool.setuptools.package-data]
pyv8c = ["baselines/*.json"]
